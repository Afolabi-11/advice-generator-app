<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Advice generator app</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="advice-card">
    <p class="advice-id">ADVICE #<span id="advice-id">117</span></p>

    <h1 id="advice-text">"Click the dice to get some advice."</h1>

    <picture class="divider">
      <source media="(max-width: 600px)" srcset="./images/pattern-divider-mobile.svg">
      <img src="./images/pattern-divider-desktop.svg" alt="">
    </picture>

    <button id="advice-button" type="button" aria-label="Generate new advice">
      <img src="./images/icon-dice.svg" alt="">
    </button>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Habeeb Afolabi</a>.
  </footer>

  <script src="./script.js"></script>
</body>
</html>
